# Identification du projet
sonar.projectKey=devops-course
sonar.organization=Aziz Bouzir
sonar.host.url=https://sonarcloud.io

# Chemins du code à analyser
sonar.sources=src

# Fichiers à exclure
sonar.exclusions=**/*.test.js

# Rapport de couverture des tests (si disponible)
sonar.javascript.lcov.reportPaths=coverage/lcov.info



sonar.issue.ignore.multicriteria=e1

sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/*.yml